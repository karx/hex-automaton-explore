# Pattern A (official Pages Actions) + a test gate.
# Tests must pass before deploy. Production only — no PR preview folders.
# Repo setting: Settings → Pages → Source: GitHub Actions
# Live: https://karx.github.io/hex-automaton-explore/
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install production deps
        run: npm ci --omit=dev

      - name: Stage static site
        run: |
          mkdir -p _site/node_modules
          cp index.html viewer3d.html langtons-ant.html _site/
          cp robots.txt sitemap.xml site.webmanifest og-image.png favicon.svg \
             favicon-32x32.png favicon-192.png favicon-512.png apple-touch-icon.png _site/
          cp -r src docs gifs gifs-v2 _site/
          cp -r node_modules/three _site/node_modules/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
